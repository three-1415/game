<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OvO Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, iframe { width: 100%; height: 100%; border: none; background: #000; overflow: hidden; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="status">Loading game...</div>
    <iframe id="gameFrame" allow="autoplay; fullscreen"></iframe>

    <script>
        const fileUrl = "https://raw.githubusercontent.com/APPLESSSSSSDOTCOM/ovo/refs/heads/main/Copy%20of%20ovo.html";

        // Memory mock for localStorage to prevent null-origin crashes
        const storagePolyfill = `
        <script>
            try {
                window.localStorage.getItem('test');
            } catch (e) {
                const store = {};
                Object.defineProperty(window, 'localStorage', {
                    value: {
                        getItem: k => store[k] || null,
                        setItem: (k, v) => store[k] = String(v),
                        removeItem: k => delete store[k],
                        clear: () => { for (let k in store) delete store[k]; }
                    }
                });
            }
        <\/script>
        `;

        fetch(fileUrl)
            .then(res => res.text())
            .then(html => {
                // Inject the polyfill right after <head>
                const fixedHtml = html.replace('<head>', '<head>' + storagePolyfill);
                
                const iframe = document.getElementById("gameFrame");
                const doc = iframe.contentWindow.document;
                
                doc.open();
                doc.write(fixedHtml);
                doc.close();

                iframe.contentWindow.focus();
                document.getElementById("status")?.remove();
            })
            .catch(err => {
                document.getElementById("status").innerText = "Error: " + err.message;
            });
    </script>
</body>
</html>
